version: 2

# As in the model schema.yml, every data test is given an explicit short `name`
# so the test node names (reported by dlt's dbt runner) and the store_failures
# audit table names stay readable. Without these, dbt's generated names for the
# relationships tests in particular are long enough to be truncated and hashed.
sources:
  - name: ncbi
    description: >
      Raw NCBI taxdump tables loaded by the dlt pipeline. The schema matches the
      dlt pipeline's dataset_name.
    schema: ncbi
    tables:
      - name: taxonomy_nodes
        description: "nodes.dmp — one row per taxon."
        columns:
          - name: tax_id
            data_tests:
              - not_null:
                  name: not_null_ncbi_nodes_tax_id
          - name: parent_tax_id
            data_tests:
              - not_null:
                  name: not_null_ncbi_nodes_parent_tax_id
          - name: rank
            data_tests:
              - not_null:
                  name: not_null_ncbi_nodes_rank
      - name: taxonomy_names
        description: "names.dmp - one row per name."
        columns:
          - name: tax_id
            data_tests:
              - not_null:
                  name: not_null_ncbi_names_tax_id
          - name: name_txt
            data_tests:
              - not_null:
                  name: not_null_ncbi_names_name_txt
          - name: name_class
            data_tests:
              - not_null:
                  name: not_null_ncbi_names_name_class
      - name: taxonomy_merged
        description: "merged.dmp — maps a merged (old) tax_id to its current tax_id."
        columns:
          - name: old_tax_id
            data_tests:
              - not_null:
                  name: not_null_ncbi_merged_old_tax_id
          - name: new_tax_id
            data_tests:
              - not_null:
                  name: not_null_ncbi_merged_new_tax_id

  - name: catalog_source
    description: >
      Catalog inputs written into DuckDB by build.py before the dbt run.
    schema: catalog_source
    tables:
      - name: assembly_taxa
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: not_null_source_assembly_taxa_taxonomy_id
              - relationships:
                  name: rel_source_assembly_taxa_to_assemblies
                  arguments:
                    to: ref('taxonomy_assemblies')
                    field: taxonomy_id
      - name: organism_taxa
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: not_null_source_organism_taxa_taxonomy_id
              - relationships:
                  name: rel_source_organism_taxa_to_organisms
                  arguments:
                    to: ref('taxonomy_organisms')
                    field: taxonomy_id
      - name: outbreak_taxa
        # Only tested when the catalog has outbreaks
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: not_null_source_outbreak_taxa_taxonomy_id
                  config:
                    enabled: "{{ var('has_outbreaks', false) }}"
              - relationships:
                  name: rel_source_outbreak_taxa_to_outbreaks
                  arguments:
                    to: ref('taxonomy_outbreaks')
                    field: taxonomy_id
                  config:
                    enabled: "{{ var('has_outbreaks', false) }}"
