version: 2

# As in the model schema.yml, every data test is given an explicit short `name`
# so the test node names (reported by dlt's dbt runner) and the store_failures
# audit table names stay readable. Without these, dbt's generated names for the
# relationships tests in particular are long enough to be truncated and hashed.
# The name lengths should be limited to 63 bytes for Postgres compatibility.
sources:
  - name: ncbi
    description: >
      Raw NCBI taxdump tables loaded by the dlt pipeline. The schema matches the
      dlt pipeline's dataset_name.
    schema: ncbi
    tables:
      - name: taxonomy_nodes
        description: "nodes.dmp — one row per taxon."
        columns:
          - name: tax_id
            data_tests:
              - not_null:
                  name: ncbi_nodes_have_tax_ids
          - name: parent_tax_id
            data_tests:
              - not_null:
                  name: ncbi_nodes_have_parents
          - name: rank
            data_tests:
              - not_null:
                  name: ncbi_nodes_have_ranks
      - name: taxonomy_names
        description: "names.dmp - one row per name."
        columns:
          - name: tax_id
            data_tests:
              - not_null:
                  name: ncbi_names_have_tax_ids
          - name: name_txt
            data_tests:
              - not_null:
                  name: ncbi_names_have_names
          - name: name_class
            data_tests:
              - not_null:
                  name: ncbi_names_have_classes
      - name: taxonomy_merged
        description: "merged.dmp — maps a merged (old) tax_id to its current tax_id."
        columns:
          - name: old_tax_id
            data_tests:
              - not_null:
                  name: ncbi_merged_have_old_id
          - name: new_tax_id
            data_tests:
              - not_null:
                  name: ncbi_merged_have_new_id

  - name: catalog_source
    description: >
      Catalog inputs written into DuckDB by build.py before the dbt run.
    schema: catalog_source
    tables:
      - name: assembly_taxa
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: catalog_assemblies_have_tax_ids
              - relationships:
                  name: catalog_assembly_taxa_in_assembly_taxonomy
                  arguments:
                    to: ref('taxonomy_assemblies')
                    field: taxonomy_id
      - name: organism_taxa
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: catalog_organisms_have_tax_ids
              - relationships:
                  name: catalog_organism_taxa_in_organism_taxonomy
                  arguments:
                    to: ref('taxonomy_organisms')
                    field: taxonomy_id
          - name: synonyms
            description: >
              JSON list of the curated synonyms specified for the organism in the
              source organisms file, or null where none are specified.
      - name: outbreak_taxa
        # Only tested when the catalog has outbreaks
        columns:
          - name: taxonomy_id
            data_tests:
              - not_null:
                  name: catalog_outbreaks_have_tax_ids
                  config:
                    enabled: "{{ var('has_outbreaks', false) }}"
              - relationships:
                  name: catalog_outbreak_taxa_in_outbreak_taxonomy
                  arguments:
                    to: ref('taxonomy_outbreaks')
                    field: taxonomy_id
                  config:
                    enabled: "{{ var('has_outbreaks', false) }}"
