[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# Alembic 1.16 deprecates the legacy space/comma/colon splitting of the paths
# above. One entry with no separator in it, so this is a no-op that quiets the
# warning on every startup migration.
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
