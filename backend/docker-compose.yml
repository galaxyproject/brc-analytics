services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-0.19.0}
    env_file:
      - path: ./api/.env.example
      - path: ./api/.env
        required: false
    environment:
      CATALOG_PATH: /catalog/output
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../catalog:/catalog:ro
      # The SRA metadata mirror is a DuckDB file on the host, so it has to be
      # mounted in as well as configured. Set SRA_MIRROR_HOST_PATH to the
      # .duckdb file and SRA_MIRROR_PATH=/data/sra-mirror.duckdb in api/.env.
      # Both are needed: with only the variable set the path does not exist in
      # the container, and with only the mount the service stays disabled.
      - ${SRA_MIRROR_HOST_PATH:-/dev/null}:/data/sra-mirror.duckdb:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis_data:
