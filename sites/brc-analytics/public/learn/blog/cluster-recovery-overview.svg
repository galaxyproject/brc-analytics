<text x="370" y="286" font-size="6" fill="#a0a8b2" text-anchor="middle" font-family="DejaVu Sans, sans-serif">Vendor A</text>

<!-- Footer note -->
<text x="28" y="302" font-size="6" fill="#a0a8b2" font-family="DejaVu Sans, sans-serif">Two clusters recovered from haplotype calls alone — no epidemiological label used.</text>
</svg>
