<text x="14" y="457" font-size="8" fill="#68717c" font-family="DejaVu Sans, sans-serif">Cmt109.A has no exact-match units. Cmt127.A is 135 bp, not 127, and carries 11 nt of Nextera adapter in its truncated 3&#8242; flank. Equal-length references can differ in unit count because the flanks contain near-copies of the motif, so the array boundary is set by exact matching rather than being fixed.</text>
